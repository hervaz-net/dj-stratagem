<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored theme before first paint so a dark-theme visitor
      // never sees a white flash on load.
      (function () {
        try {
          var stored = localStorage.getItem("djs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="The B2B supply network for construction. Manufacturers, distributors, and contractors buy and sell materials on one marketplace." />
    <link rel="canonical" href="https://djstratageminc.com/" />

    <meta property="og:site_name" content="D&J Stratagem, Inc." />
    <meta property="og:title" content="Stratagem Exchange by D&amp;J Stratagem | The B2B Supply Network for Construction" />
    <meta property="og:description" content="The B2B supply network for construction. Manufacturers, distributors, and contractors buy and sell materials on one marketplace." />
