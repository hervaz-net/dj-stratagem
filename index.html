    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored theme before first paint so a dark-theme visitor
      // never sees a white flash on load.
      (function () {
        try {
          // One public origin; www keeps its own storage and cache otherwise.
          if (location.hostname === "www.djstratageminc.com") {
            location.replace("https://djstratageminc.com" + location.pathname + location.search + location.hash);
            return;
          }
          var stored = localStorage.getItem("djs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
