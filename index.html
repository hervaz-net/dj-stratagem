    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored theme before first paint so a dark-theme visitor
      // never sees a white flash on load.
      (function () {
        try {
          var stored = localStorage.getItem("djs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
