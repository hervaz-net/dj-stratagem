<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fef5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored theme before first paint so a dark-theme visitor
      // never sees a white flash on load.
      (function () {
        try {
          var stored = localStorage.getItem("djs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="D&J Stratagem is the operating system for construction growth — helping contractors win more work, market their business, and manage the entire bidding pipeline from opportunity to award." />
    <link rel="canonical" href="https://djstratageminc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="D&J Stratagem, Inc." />
    <meta property="og:title" content="D&J Stratagem, Inc. | Find Construction Projects. Bid Smarter. Win More Work." />
    <meta property="og:description" content="Find construction bid opportunities, manage your pipeline, and win more work. Tools for contractors, subcontractors, and suppliers to discover projects that match their trade and territory." />
    <meta property="og:url" content="https://djstratageminc.com/" />
    <meta name="twitter:card" content="summary" />
    <!-- Self-hosted: no visitor IP disclosed to a third party before consent,
         and two fewer round trips on the critical path. See public/fonts/. -->
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>D&J Stratagem, Inc. | Find Construction Projects. Bid Smarter. Win More Work.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
