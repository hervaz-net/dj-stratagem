name: Django CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Lint
        run: |
          python -m pip install 'ruff==0.17.6'
          ruff check .
      - name: Build CSS
        working-directory: theme
        run: |
          npm ci
          npm run css
      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python -m pip install -r requirements-dev.txt
          coverage run manage.py test --verbosity 1
          coverage report --fail-under=95
      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-deploy-check-0123456789abcdefABCDEF-not-a-secret
          DJANGO_ALLOWED_HOSTS: djstratageminc.com,www.djstratageminc.com
          CSRF_TRUSTED_ORIGINS: https://djstratageminc.com,https://www.djstratageminc.com
          DJANGO_BEHIND_PROXY: "1"
          DJANGO_SECURE_SSL: "1"
        run: |
          mkdir -p data
          python manage.py check --deploy

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t djstratagem:ci .
