name: Publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/api/health.php
          test -f dist/.htaccess
          grep -q 'application/x-httpd-alt-php81___lsphp' dist/.htaccess

      - name: Refresh deploy branch from dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          TOKEN="${DEPLOY_PAT:-${GH_TOKEN}}"
          WORK="$(mktemp -d)"
          git clone --quiet --branch deploy --single-branch \
            "https://x-access-token:${TOKEN}@github.com/hervaz-net/dj-stratagem.git" \
            "$WORK/repo"
          cd "$WORK/repo"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." .
          cp "$GITHUB_WORKSPACE/scripts/cpanel.yml" .cpanel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "deploy branch already matches this build"
          else
            git commit -m "Deploy ${SHORT}"
            if ! git push origin deploy; then
              echo "::error::Push to deploy was rejected. The ~ALL branch ruleset blocks github-actions[bot]."
              echo "Add repo secret DEPLOY_PAT or exclude refs/heads/deploy from the ruleset."
              exit 1
            fi
            echo "pushed deploy $(git rev-parse --short HEAD) from main ${SHORT}"
          fi

      - name: Pull and deploy on cPanel
        id: cpanel
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN}" ]; then
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::error::CPANEL_TOKEN repo secret is missing."
            echo "GitHub deploy branch is current. public_html was not pulled."
            echo "Add repo secret CPANEL_TOKEN, or cPanel Git Version Control: Update from Remote then Deploy HEAD."
            echo "Or run ./deploy.sh on a machine with ~/.cpanel_token."
            exit 1
          fi
          echo "pulled=true" >> "$GITHUB_OUTPUT"
          AUTH="cpanel djstlime:${CPANEL_TOKEN}"
          HOST="https://server247.web-hosting.com:2083"
          ROOT="/home/djstlime/repositories/dj-stratagem"
          curl -sS --max-time 90 -H "Authorization: ${AUTH}" --get --data-urlencode "repository_root=${ROOT}" --data-urlencode "branch=deploy" "${HOST}/execute/VersionControl/update"
          echo
          curl -sS --max-time 90 -H "Authorization: ${AUTH}" -X POST --data-urlencode "repository_root=${ROOT}" "${HOST}/execute/VersionControlDeployment/create"
          echo

      - name: Report live vs dist hash
        if: always()
        run: |
          set -uo pipefail
          EXPECTED="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1 || true)"
          LIVE="$(curl -sS --max-time 30 https://djstratageminc.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
          echo "expected ${EXPECTED:-<none>}"
          echo "live     ${LIVE:-<none>}"

      - name: Verify live bundle hash
        if: always()
        run: |
          set -euo pipefail
          EXPECTED="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1 || true)"
          echo "expected ${EXPECTED:-<none>}"
          if [ -z "${EXPECTED}" ]; then echo "::error::dist/index.html has no hashed JS bundle."; exit 1; fi
          LIVE=""
          for i in 1 2 3 4 5 6; do
            LIVE="$(curl -sS --max-time 30 https://djstratageminc.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
            echo "attempt ${i}: live ${LIVE:-<none>}"
            if [ "${LIVE}" = "${EXPECTED}" ]; then echo "live matches dist"; exit 0; fi
            sleep 5
          done
          echo "::error::Live site still serving ${LIVE:-<none>}; dist built ${EXPECTED}."
          echo "cPanel did not pull deploy. Update from Remote + Deploy HEAD, or ./deploy.sh."
          exit 1
