name: Publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Refresh deploy branch from dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          WORK="$(mktemp -d)"
          git clone --quiet --branch deploy --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/hervaz-net/dj-stratagem.git" \
            "$WORK/repo"
          cd "$WORK/repo"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." .
          cp "$GITHUB_WORKSPACE/scripts/cpanel.yml" .cpanel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "deploy branch already matches this build"
          else
            git commit -m "Deploy ${SHORT}"
            git push origin deploy
            echo "pushed deploy $(git rev-parse --short HEAD) from main ${SHORT}"
          fi

      - name: Pull and deploy on cPanel
        id: cpanel
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN}" ]; then
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::error::CPANEL_TOKEN repo secret is missing."
            echo "GitHub deploy branch is current. public_html was not pulled."
            echo "Add repo secret CPANEL_TOKEN (cPanel API token for djstlime), or:"
            echo "  cPanel → Git Version Control → dj-stratagem"
            echo "  1. branch deploy"
            echo "  2. Update from Remote"
            echo "  3. Deploy HEAD Commit"
            echo "Or run ./deploy.sh on a machine with ~/.cpanel_token."
            exit 1
          fi
          echo "pulled=true" >> "$GITHUB_OUTPUT"
          AUTH="cpanel djstlime:${CPANEL_TOKEN}"
          HOST="https://server247.web-hosting.com:2083"
          ROOT="/home/djstlime/repositories/dj-stratagem"
          echo "Pulling deploy on the server"
          curl -sS --max-time 90 -H "Authorization: ${AUTH}" \
            --get \
            --data-urlencode "repository_root=${ROOT}" \
            --data-urlencode "branch=deploy" \
            "${HOST}/execute/VersionControl/update"
          echo
          echo "Triggering cPanel deployment"
          curl -sS --max-time 90 -H "Authorization: ${AUTH}" \
            -X POST \
            --data-urlencode "repository_root=${ROOT}" \
            "${HOST}/execute/VersionControlDeployment/create"
          echo

      - name: Report live vs dist hash
        if: always()
        run: |
          set -euo pipefail
          EXPECTED="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\\.js' dist/index.html | head -1)"
          LIVE="$(curl -sS --max-time 30 https://djstratageminc.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\\.js' | head -1 || true)"
          echo "expected ${EXPECTED}"
          echo "live     ${LIVE:-<none>}"

      # Always compare hashes. Skipping this when CPANEL_TOKEN is missing
      # marked the job green while djstratageminc.com kept serving an old
      # bundle (index-Clfgkqwf.js vs deploy's index-X-bBSPML.js).
      # If the apex has no A/AAAA record, say so — do not blame a cPanel miss.
      - name: Verify live bundle hash
        if: always()
        run: |
          set -euo pipefail
          EXPECTED="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\\.js' dist/index.html | head -1)"
          echo "expected ${EXPECTED}"
          if ! python3 -c 'import socket,sys; socket.getaddrinfo("djstratageminc.com", 443)'; then
            echo "::error::djstratageminc.com has no public A/AAAA record. GitHub deploy is current; the host is unreachable."
            echo "Namecheap → Domain List → Manage → Advanced DNS:"
            echo "  A     @     199.188.200.92"
            echo "  CNAME www   djstratageminc.com."
            echo "That IPv4 is server247.web-hosting.com (cPanel user djstlime)."
            echo "Wait for DNS, then: cPanel → Git Version Control → Update from Remote → Deploy HEAD."
            echo "Or run ./deploy.sh on a machine with ~/.cpanel_token after DNS answers."
            exit 1
          fi
          LIVE=""
          for i in 1 2 3 4 5 6; do
            LIVE="$(curl -sS --max-time 30 https://djstratageminc.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\\.js' | head -1 || true)"
            echo "attempt ${i}: live ${LIVE:-<none>}"
            if [ "${LIVE}" = "${EXPECTED}" ]; then
              echo "live matches dist"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live site still serving ${LIVE:-<none>}; dist built ${EXPECTED}."
          echo "cPanel did not pull deploy. On the host:"
          echo "  cPanel → Git Version Control → dj-stratagem"
          echo "  1. branch deploy"
          echo "  2. Update from Remote"
          echo "  3. Deploy HEAD Commit"
          echo "Or run ./deploy.sh on a machine with ~/.cpanel_token."
          echo "Add repo secret CPANEL_TOKEN so this workflow can pull the host."
          echo "Confirm public_html is djstlime:nobody mode 0750."
          exit 1
