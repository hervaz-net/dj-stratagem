name: Publish Django to cPanel

# Uses the existing cPanel token to pull this source onto the host and run
# scripts/cpanel-django-deploy.sh. That script does not replace the public
# homepage until https://djstratageminc.com/djs-preview/health/ is Django.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against deploying behind main
        run: |
          set -euo pipefail
          git fetch -q origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          if [ "$behind" != "0" ]; then
            echo "::error::HEAD is ${behind} commit(s) behind origin/main."
            exit 1
          fi

      - name: Refresh deploy branch
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          TOKEN="${DEPLOY_PAT:-${GH_TOKEN}}"
          WORK="$(mktemp -d)"
          git clone --quiet --branch deploy --single-branch \
            "https://x-access-token:${TOKEN}@github.com/hervaz-net/dj-stratagem.git" \
            "$WORK/repo"
          cd "$WORK/repo"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude 'theme/node_modules/' \
            --exclude 'data/' \
            --exclude 'media/' \
            --exclude 'staticfiles/' \
            --exclude 'public/data/' \
            --exclude '.env' \
            "$GITHUB_WORKSPACE/" ./
          cp "$GITHUB_WORKSPACE/scripts/cpanel.yml" .cpanel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "deploy branch already matches this build"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Deploy Django ${SHORT}"
            if ! git push origin deploy; then
              echo "::error::Push to deploy was rejected. Add DEPLOY_PAT or allow this token to update refs/heads/deploy."
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
          git fetch --quiet origin deploy
          if ! git cat-file -e "origin/deploy:passenger_wsgi.py" \
            || ! git cat-file -e "origin/deploy:scripts/cpanel-django-deploy.sh" \
            || ! git cat-file -e "origin/deploy:.cpanel.yml"; then
            echo "::error::deploy branch is missing the Django entry files."
            exit 1
          fi

      - name: Pull and deploy on cPanel
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CPANEL_TOKEN}" ] || missing="${missing} CPANEL_TOKEN"
          [ -n "${CPANEL_USER}" ]  || missing="${missing} CPANEL_USER"
          [ -n "${CPANEL_HOST}" ]  || missing="${missing} CPANEL_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):${missing}."
            exit 1
          fi
          HOST="${CPANEL_HOST#https://}"; HOST="${HOST%/}"
          case "$HOST" in *:*) ;; *) HOST="${HOST}:2083" ;; esac
          ROOT="/home/${CPANEL_USER}/repositories/dj-stratagem"
          uapi() {
            local module="$1" func="$2"; shift 2
            curl -sS --fail-with-body --max-time 180 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "https://${HOST}/execute/${module}/${func}" "$@"
          }
          api_check() {
            python3 -c '
import json,sys
raw=sys.stdin.read()
try: d=json.loads(raw)
except Exception: print("::error::non-JSON UAPI response:", raw[:300]); sys.exit(1)
if not d.get("status") or d.get("errors"):
    print("::error::UAPI failed:", "; ".join(map(str, d.get("errors") or ["status=0"]))); sys.exit(1)
print("  ok")
'
          }
          echo "==> VersionControl/update (branch deploy)"
          uapi VersionControl update --get \
            --data-urlencode "repository_root=${ROOT}" \
            --data-urlencode "branch=deploy" | api_check
          echo "==> VersionControlDeployment/create"
          uapi VersionControlDeployment create -X POST \
            --data-urlencode "repository_root=${ROOT}" | api_check

      - name: Verify the live site is Django
        run: |
          set -euo pipefail
          health=""
          home=""
          for i in $(seq 1 12); do
            health="$(curl -fsS --max-time 30 "https://djstratageminc.com/health/" || true)"
            home="$(curl -fsS --max-time 30 "https://djstratageminc.com/" || true)"
            if printf '%s' "$health" | grep -q '"service": "django"' && printf '%s' "$home" | grep -q 'Find the work'; then
              echo "live django health ${health}"
              exit 0
            fi
            echo "attempt ${i}: health=${health:-<none>}"
            sleep 10
          done
          echo "::error::https://djstratageminc.com/health/ did not report Django. The deploy script should have left the static homepage in place."
          exit 1
