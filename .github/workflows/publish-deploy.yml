name: Django image

# This replaces the cPanel static publish.
# It does not push the `deploy` branch and it does not call the cPanel API,
# so merging it leaves the current public_html site in place until DNS is
# pointed at a host that runs this container.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t djstratagem:${{ github.sha }} .

      - name: Push image
        if: ${{ vars.DJANGO_DEPLOY_ENABLED == 'true' }}
        env:
          REGISTRY: ${{ vars.DJANGO_REGISTRY }}
          IMAGE: ${{ vars.DJANGO_IMAGE }}
          REGISTRY_USER: ${{ secrets.DJANGO_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DJANGO_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY"
          test -n "$IMAGE"
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_PASSWORD"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker tag "djstratagem:${GITHUB_SHA}" "$IMAGE:${GITHUB_SHA}"
          docker tag "djstratagem:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:${GITHUB_SHA}. Restart the host process yourself; this workflow does not touch cPanel."
