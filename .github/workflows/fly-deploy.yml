name: Deploy to Fly

# Manual only. Automatic deploys stay off until a person turns them on.
# Requires the Actions secret FLY_API_TOKEN (fly tokens create deploy).
on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
