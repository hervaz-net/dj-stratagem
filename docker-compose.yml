services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_BEHIND_PROXY: "0"
      DJANGO_SECURE_SSL: "0"
    volumes:
      - djs-data:/app/data
      - djs-media:/app/media
    restart: unless-stopped

volumes:
  djs-data:
  djs-media:
