---
deployment:
  tasks:
    - /usr/bin/rsync -rltD --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='api/config.php' --exclude='djs-config.php' ./ /home/djstlime/public_html/
    - /usr/bin/find /home/djstlime/public_html -type d -exec /bin/chmod 0755 {} +
    - /usr/bin/find /home/djstlime/public_html -type f -exec /bin/chmod 0644 {} +
    - /bin/chgrp nobody /home/djstlime/public_html
    - /bin/chmod 0750 /home/djstlime/public_html
